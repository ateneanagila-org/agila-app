name = "agila-sync-cron"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[triggers]
crons = ["*/10 * * * *"]

[vars]
APP_URL = "https://your-app.vercel.app"

# CRON_SECRET and DISCORD_WEBHOOK_URL are set via:
# wrangler secret put CRON_SECRET
# wrangler secret put DISCORD_WEBHOOK_URL (optional, for alerting)
